      - {name: Sector authorities under Annex I Section A law, scope: AI in regulated products (§ 2(2)), status: designated}
      - {name: Land (state) authorities, scope: "Land public bodies and media providers (§ 2(6), (8))", status: designated}
    notifying_authorities:
      - {name: Sector notifying authorities, scope: § 3(1), status: designated}
      - {name: BSI (interim), scope: Annex III point 1 (§ 3(2)), status: designated}
      - {name: DAkkS, scope: accreditation body (§ 3(4)), status: designated}
    penalties:
      status: national_rules
      notes: AI Act Art. 99 applied via the OWiG (§ 16); national offences up to EUR 50 000 (§ 15(3)); no fines on public bodies (§ 17(2)).
    sandbox:
      status: planned
      notes: KI-Reallabor run by the Bundesnetzagentur (§ 13); a real-world testing plan counts as approved if there is no answer within 30 days (§ 14).
    national_extras: null
    sources: [aiactguide, fli, {title: BGBl. 2026 I Nr. 223, url: "https://www.recht.bund.de/bgbl/1/2026/223/VO.html"}]
    last_verified: 2026-11-19
    confidence: medium
    open_questions: [Full official title of KI-MIG not confirmed (tracker gives two expansions). FLI (Jun 2026) still listed it as a draft; superseded by enactment on 28 Jul 2026.]

