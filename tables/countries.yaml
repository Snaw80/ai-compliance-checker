# Country profile table: one row per EU member state (27) + EEA EFTA state (3).
#
# Read by aiact.tables.get_country_profile(). The AI Act is the same in every member state;
# this table holds only what differs by country (who supervises, national law, penalties,
# sandbox). Answers must show `last_verified` and the sources.
#
# Seeded 2026-11-19 from two trackers, newest wins on conflicts:
#   - aiactguide.net (statuses as of 24 Oct 2026; Germany/Spain pages Nov/Oct 2026)
#   - FLI national implementation plans (17 Jun 2026)
# plus the AI Act Service Desk national-resources directory and research/05-country-coverage.md.
# The Commission's Art. 70(2) single-point-of-contact list could not be fetched (not linked from
# the Service Desk Art. 70 page).
#
# confidence:
#   high   = a human checked the row against the official gazette / government page
#   medium = trackers agree, or a recent tracker cites the official text (not opened by us)
#   low    = single source, trackers disagree, or only proposals exist
# No row is `high` yet: nobody has opened the gazettes. Raise a row to `high` only after you
# have checked it yourself, and bump `last_verified`.
#
# Enums:
#   membership: EU | EEA
#   coverage_tier: deep (national documents indexed for RAG) | profile_only
#   national_law.status: in_force | adopted | bill | draft | lapsed | none | unknown
#   authority status: designated | proposed | unclear
#   penalties.status: national_rules | none | unknown
#   sandbox.status: operational | pilot | planned | none | unknown

sources:
  aiactguide: {title: "aiactguide.net: AI Act national authorities", url: "https://aiactguide.net/authorities/", as_of: 2026-11-11}
  fli: {title: "FLI: national implementation plans", url: "https://artificialintelligenceact.eu/national-implementation-plans/", as_of: 2026-06-17}
  service_desk: {title: "AI Act Service Desk: national resources", url: "https://ai-act-service-desk.ec.europa.eu/en/national-resources", as_of: 2026-11-19}
  research: {title: "Project research notes (research/00-overview.md, 05-country-coverage.md)", url: "research/05-country-coverage.md", as_of: 2026-11-18}

