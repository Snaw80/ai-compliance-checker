[project]
name = "aiact"
version = "0.1.0"
description = "AI Act assistant: RAG over the EU AI Act + national rules, fully local models"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0.3",
    "langgraph>=1.2.22",
    "langchain-ollama>=1.1.0",
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiact"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::bs4.XMLParsedAsHTMLWarning",
    "ignore::DeprecationWarning:importlib._bootstrap",
]
